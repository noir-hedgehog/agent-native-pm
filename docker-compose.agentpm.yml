services:
  agentpm:
    container_name: agentpm
    build:
      context: .
      dockerfile: Dockerfile.agentpm
    restart: unless-stopped
    env_file:
      - .env.agentpm
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    volumes:
      - agentpm_data:/data
    ports:
      - "127.0.0.1:8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - plane

  agentpm-timeout-worker:
    container_name: agentpm-timeout-worker
    build:
      context: .
      dockerfile: Dockerfile.agentpm
    restart: unless-stopped
    command: ["python", "-m", "agentpm.timeout_worker"]
    env_file:
      - .env.agentpm
    volumes:
      - agentpm_data:/data
    networks:
      - plane
    depends_on:
      agentpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  agentpm_data:

networks:
  plane:
    name: plane_default
    external: true
