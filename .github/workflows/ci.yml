name: AgentPM CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m py_compile src/agentpm/*.py src/agentpm/adapters/*.py src/agentpm/persistence/*.py scripts/*.py
      - run: bash -n scripts/*.sh
      - run: docker build -f Dockerfile.agentpm -t agentpm:test .
      - run: docker run -d --name agentpm-ci -p 127.0.0.1:8080:8080 -e HOST=0.0.0.0 -e AGENTPM_AGENT_PROVIDER=dev agentpm:test
      - run: for i in {1..30}; do curl -fsS http://127.0.0.1:8080/health && exit 0; sleep 1; done; exit 1
